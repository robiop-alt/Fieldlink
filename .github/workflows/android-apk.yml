name: Build OFFSET Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offset-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare signing credentials
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.OFFSET_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OFFSET_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OFFSET_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OFFSET_ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/offset-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signed release skipped until all four signing secrets are configured."
          fi

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        working-directory: android
        env:
          OFFSET_VERSION_CODE: ${{ github.run_number }}
          OFFSET_VERSION_NAME: 0.1.${{ github.run_number }}
          OFFSET_KEYSTORE_PATH: ${{ runner.temp }}/offset-release.jks
          OFFSET_KEYSTORE_PASSWORD: ${{ secrets.OFFSET_ANDROID_KEYSTORE_PASSWORD }}
          OFFSET_KEY_ALIAS: ${{ secrets.OFFSET_ANDROID_KEY_ALIAS }}
          OFFSET_KEY_PASSWORD: ${{ secrets.OFFSET_ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Publish Android release
        if: steps.signing.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "offset-android-${{ github.run_number }}" \
            android/app/build/outputs/apk/release/app-release.apk#OFFSET.apk \
            --title "OFFSET Android 0.1.${{ github.run_number }}" \
            --notes "Signed OFFSET Android controller update (build ${{ github.run_number }})." \
            --latest

      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/offset-release.jks"
