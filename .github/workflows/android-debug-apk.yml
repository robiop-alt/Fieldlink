name: Build OFFSET Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-debug-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout OFFSET source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload OFFSET debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OFFSET-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
