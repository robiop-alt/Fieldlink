<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OFFSET"><link rel="apple-touch-icon" sizes="180x180" href="/pwa/iphone-logo-v2-180.png"><link id="offset-pwa-manifest" rel="manifest" href="/app.webmanifest"><script>document.getElementById('offset-pwa-manifest').href='/app.webmanifest?project='+encodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');</script><title>OFFSET · Review</title><script src="/static/new-clips.js?v=1"></script><script defer src="/static/upload-time.js?v=1"></script><link rel="stylesheet" href="/static/style.css?v=logo-fix-2"><link rel="stylesheet" href="/static/review-enhancements.css?v=logo-green-1"><link rel="stylesheet" href="/static/offset-player.css?v=frame-panel-1"><link rel="stylesheet" href="/static/incoming-status.css?v=5"><link rel="stylesheet" href="/static/review-finish.css?v=storage-footer-1"><style>
.offset-uploaded-name{display:grid;gap:3px;min-width:0}.offset-uploaded-name b{overflow-wrap:anywhere}.clipmeta .offset-uploaded-age{display:block;color:#57b62f;font-size:11px;letter-spacing:.01em;font-variant-numeric:tabular-nums}

.offset-video-stage video{display:block;width:100%;height:auto;min-height:160px;background:#000}

.offset-frame-guides[hidden]{display:none}

.offset-view-controls select{background:#20272a;color:#fff;border:1px solid #556064;border-radius:6px;padding:5px 8px}
</style></head><body><main class="shell"><header class="top"><a class="brand" href="/"><img src="/static/offset-logo.svg?v=approved-artwork-1" alt="OFFSET." width="140" height="34" style="display:block;width:140px;max-width:38vw;height:auto;min-height:32px" /></a><nav class="review-account-nav" aria-label="Account"><span class="tag">PRIVATE REVIEW</span><a class="review-admin-login" href="/#login">Admin login</a></nav></header><section class="panel" id="gate"><p class="eyebrow">ACCESS REQUIRED</p><h2>Project PIN</h2><label>PIN code<input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit PIN"></label><button id="unlock">Open rushes</button><p id="error" class="error"></p></section><section id="content" class="hidden"><div class="panel review-panel"><div class="review-heading"><h2 id="review-project-name">Rushes</h2><p class="muted" id="count" aria-live="polite"></p></div><div id="review-toolbar"><div id="metadata-filters"></div><div id="offset-tools"></div></div><div id="review-player-host"></div><section id="offset-incoming" aria-label="Incoming rushes" hidden></section><div id="clips" class="clipgrid"></div><p id="clip-filter-empty" class="hint" role="status" hidden></p><div class="review-storage offset-storage-footer" role="region" aria-label="Project storage status"><div id="storage-status" class="offset-storage-dashboard" aria-live="polite"><p class="muted">Loading storage information…</p></div></div></div></section><footer>OFFSET <span>·</span> PRIVATE RUSHES DELIVERY</footer></main><script>
fetch('/api/site/settings').then(r=>{if(!r.ok)throw Error('Settings unavailable');return r.json()}).then(data=>{for(const key of ['review_title','review_highlight','review_description']){const el=document.getElementById(key);if(el&&typeof data[key]==='string')el.textContent=data[key]}}).catch(()=>{});
const slug=encodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let token='';const storageKey=`offset-review-session:${slug}`;const $=id=>document.getElementById(id);function saveAccess(data){token=data.token;try{sessionStorage.setItem(storageKey,JSON.stringify({token:data.token,expires:data.expires}))}catch(e){}}function clearAccess(){token='';try{sessionStorage.removeItem(storageKey)}catch(e){}}function showGate(message=''){clearAccess();$('gate').classList.remove('hidden');$('content').classList.add('hidden');$('error').textContent=message}async function openAccess(data){saveAccess(data);$('gate').classList.add('hidden');$('content').classList.remove('hidden');try{await load()}catch(e){showGate(e.message||'Please enter your PIN again.')}}$('unlock').onclick=unlock;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});async function unlock(){try{let r=await fetch(`/api/review/${slug}/unlock`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Invalid PIN');await openAccess(d)}catch(e){$('error').textContent=e.message}}
// Reuse a valid review session on refresh, without storing the project PIN.
(async()=>{if(new URLSearchParams(location.hash.slice(1)).has('share'))return;try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(!saved||!saved.token||!Number.isFinite(saved.expires)||saved.expires<=Date.now()/1000){clearAccess();return}await openAccess(saved)}catch(e){showGate()}})();
// Public projects issue short-lived sessions automatically; the project link itself does not expire.
(async()=>{if(new URLSearchParams(location.hash.slice(1)).has('share'))return;try{const r=await fetch(`/api/review/${slug}/public-unlock`,{method:'POST'});if(!r.ok)return;await openAccess(await r.json())}catch(e){$('error').textContent='Unable to open project. Please refresh.'}})();
let selected=new Set();const visitTracker=window.OffsetNewClips?.create(slug);let onlyNewClips=false;
// PIN-free share links carry a 24-hour signed token in the URL fragment.
(async()=>{
 const share=new URLSearchParams(location.hash.slice(1)).get('share');
 if(!share)return;
 history.replaceState(null,'',location.pathname+location.search);
 try{
  const r=await fetch(`/api/review/${slug}/share-unlock`,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({share_token:share})
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.detail||'Share link has expired');
  await openAccess(data);
 }catch(e){$('error').textContent=e.message+' · Enter the project PIN to continue.'}
})();

function formatStorageBytes(bytes){
 const value=Number(bytes);if(!Number.isFinite(value)||value<0)throw Error('Invalid storage total');
 const units=['B','KB','MB','GB','TB'];let amount=value,index=0;
 while(amount>=1024&&index<units.length-1){amount/=1024;index++}
 return new Intl.NumberFormat('en-GB',{maximumFractionDigits:index?2:0}).format(amount)+' '+units[index];
}
// Sort is a presentation preference: it never modifies filenames or server records.
const clipSortStorageKey='offset:review-sort:'+slug;
let clipSort='uploaded';
try{if(localStorage.getItem(clipSortStorageKey)==='filename')clipSort='filename'}catch(_){}
const filenameCollator=new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});
function filenameRoll(filename){
 return filename.match(/(?:^|[^a-z0-9])([a-z]\d+)c\d+/i)?.[1]||'';
}
function compareClips(a,b){
 const aName=String(a.filename||''),bName=String(b.filename||'');
 const names=filenameCollator.compare(aName,bName);
 // Newest reel first, with clips in shooting order within each reel.
 const primary=clipSort==='filename'
  ? filenameCollator.compare(filenameRoll(bName),filenameRoll(aName))
  : (Number(b.created)||0)-(Number(a.created)||0);
 return primary||names||String(a.id).localeCompare(String(b.id));
}
function renderStorage(d){
 const target=$('storage-status');target.replaceChildren();
 const total=Number(d.used_bytes),count=Number(d.clip_count);
 if(!Number.isFinite(total)||total<0||!Number.isFinite(count)||count<0)throw Error('Invalid storage response');
 const quota=5*1024*1024*1024;
 const ratio=total/quota;
 const over=total>quota;
 const info=document.createElement('div');info.className='offset-storage-meter-head';
 const heading=document.createElement('span');heading.textContent='Project media';
 const amount=document.createElement('strong');amount.textContent=formatStorageBytes(total)+' / 5 GB';
 info.append(heading,amount);target.append(info);
 const track=document.createElement('div');track.className='offset-storage-meter';
 track.setAttribute('role','progressbar');
 track.setAttribute('aria-label','Project storage allocation: 5 GB');
 track.setAttribute('aria-valuemin','0');
 track.setAttribute('aria-valuemax',String(quota));
 track.setAttribute('aria-valuenow',String(Math.min(quota,total)));
 track.setAttribute('aria-valuetext',formatStorageBytes(total)+' of 5 GB allocated'+(over?', allocation exceeded':''));
 const fill=document.createElement('span');fill.className='offset-storage-meter-fill';
 fill.style.width=(Math.min(1,ratio)*100)+'%';
 if(over){track.classList.add('over-quota');}
 track.append(fill);target.append(track);
 const meta=document.createElement('div');meta.className='offset-storage-meter-foot';
 const clips=document.createElement('span');clips.textContent=count+' clip'+(count===1?'':'s')+' uploaded';
 const state=document.createElement('span');
 state.textContent=over?'Above allocated storage':'Storage allocation';
 meta.append(clips,state);target.append(meta);
}
async function load(){
 const r=await fetch(`/api/review/${slug}/clips`,{headers:{Authorization:`Bearer ${token}`}});
 const clips=await r.json();if(!r.ok)throw Error(clips.detail||'Could not load clips');
 clips.sort(compareClips);
 const settingsResponse=await fetch(`/api/review/${slug}/settings`,{headers:{Authorization:`Bearer ${token}`},cache:'no-store'});
 if(!settingsResponse.ok)throw Error('Project review settings unavailable');
 const projectSettings=await settingsResponse.json();
 const allowDownloads=projectSettings.allow_downloads===true;
 const projectName=typeof projectSettings.project_name==='string'?projectSettings.project_name.trim():'';
 $('review-project-name').textContent=projectName||'Rushes';
 document.title=projectName?'OFFSET · '+projectName:'OFFSET · Review';
 const newClipIds=visitTracker?visitTracker.update(clips):new Set();
 selected=new Set();
 $('count').textContent=`${clips.length} clips available`;
 let filters=document.getElementById('metadata-filters');
 if(!filters){filters=document.createElement('div');filters.id='metadata-filters';$('clips').before(filters)}
 const savedSearch=$('clip-filter')?.value||'';
 filters.innerHTML='<label class="filter-compact"><span>Filter clips</span><input id="clip-filter" type="search" placeholder="Filter clips…" title="Search filename, RAW/ProRes, lens, FPS or ISO" aria-label="Filter clips"></label><button type="button" class="new-clips-filter" id="new-clips-filter" aria-pressed="false" title="Clips added since your last visit in this browser">New · 0</button><label class="offset-sort-label" for="offset-sort-clips"><span>Sort</span><select id="offset-sort-clips" aria-label="Sort clips"><option value="filename">Filename</option><option value="uploaded">Last uploaded</option></select></label>';
 $('offset-sort-clips').value=clipSort;
 $('clip-filter').value=savedSearch;
 const renderFilter=()=>{
  const q=$('clip-filter').value.toLowerCase();let visible=0;
  document.querySelectorAll('.clip[data-search]').forEach(el=>{
   const show=el.dataset.search.includes(q)&&(!onlyNewClips||el.dataset.new==='true');
   el.style.display=show?'':'none';if(show)visible++;
  });
  const toggle=$('new-clips-filter');toggle.textContent='New · '+newClipIds.size;
  toggle.setAttribute('aria-pressed',String(onlyNewClips));
  const empty=$('clip-filter-empty');empty.hidden=!clips.length||visible>0;
  empty.textContent=onlyNewClips&&!newClipIds.size?'No new clips since your last visit.':'No matching clips.';
 };
 $('new-clips-filter').onclick=()=>{onlyNewClips=!onlyNewClips;renderFilter()};
 $('offset-sort-clips').onchange=event=>{
   clipSort=event.target.value==='filename'?'filename':'uploaded';
   try{localStorage.setItem(clipSortStorageKey,clipSort)}catch(_){}
   // Do not mutate the player-owned clip array before it can preserve
   // the currently playing clip and update its navigation order.
   const sortedClips=[...clips].sort(compareClips);
   const cards=[...$('clips').querySelectorAll('.clip')];
   const lookup=new Map(cards.map(card=>[card.dataset.clipId,card]));
   const ordered=sortedClips.map(clip=>lookup.get(String(clip.id))).filter(Boolean);
   if(ordered.length===sortedClips.length){
     $('clips').append(...ordered);
     window.offsetReorderPlayer?.(sortedClips.map(clip=>String(clip.id)));
   }
   renderFilter();
 };
 const base=`/api/review/${slug}`;const auth=`session=${encodeURIComponent(token)}`;
 // Explicit DJI Pilot capture only: never derive camera settings from proxy ffprobe fields.
 const cameraFields=[['RAW / ProRes','recording_format'],['Lens','lens'],['FPS','fps'],['ISO','iso'],['WB','white_balance'],['Shutter','shutter']];
 const cameraDetails=clip=>{
   const data=clip.camera_metadata&&typeof clip.camera_metadata==='object'?clip.camera_metadata:{};
   return cameraFields.map(([title,key])=>{
     const value=data[key]===null||data[key]===undefined?'':String(data[key]).trim();
     return '<span class="offset-camera-field offset-camera-'+key+'" data-filled="'+(value?'true':'false')+'"><b>'+title+'</b><span>'+esc(value)+'</span></span>';
   }).join('');
 };
 const formatDuration=s=>{let n=Math.max(0,Math.floor(Number(s)));return Number.isFinite(n)?`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`:'--:--'};
 $('clips').innerHTML=clips.map(c=>`<article class="clip" data-clip-id="${esc(String(c.id))}" data-new="${newClipIds.has(String(c.id))}" data-search="${esc([c.filename,...Object.values(c.camera_metadata||{})].join(' ').toLowerCase())}"><div class="offset-video-stage"><video controls preload="none" playsinline webkit-playsinline poster="${base}/clips/${c.id}/thumbnail?${auth}" src="${base}/clips/${c.id}/file?${auth}"></video><div class="offset-frame-guides" aria-hidden="true" hidden></div></div><div class="offset-view-controls"><label>Frame lines <select class="offset-frame-select" aria-label="Frame lines for ${esc(c.filename)}"><option value="off">Off</option><option value="2.39">2.39:1</option><option value="2.00">2.00:1</option><option value="2.20">2.20:1</option><option value="1.85">1.85:1</option><option value="1.78">16:9</option><option value="1.33">4:3</option></select></label></div><p class="playback-help" id="playback-${c.id}" hidden>Browser playback unavailable. <a href="${base}/clips/${c.id}/file?${auth}" target="_blank" rel="noopener">Open video directly</a> or use Download clip below.</p><div class="clipmeta"><div class="offset-uploaded-name"><div class="clip-title-line"><b>${esc(c.filename)}</b>${newClipIds.has(String(c.id))?'<span class="clip-new-badge">NEW</span>':''}</div><span class="offset-uploaded-age" data-uploaded-at="${Number(c.created)||0}">Uploaded just now</span></div><span><span id="dur-${c.id}">${c.metadata?.duration_seconds!=null?formatDuration(c.metadata.duration_seconds):"--:--"}</span> · <span class="muted">${(c.size/1048576).toFixed(1)} MB</span></span><small>${cameraDetails(c)}</small></div>${allowDownloads?`<div class="clip-actions"><label class="clip-select"><input type="checkbox" data-select="${c.id}" aria-label="Select ${esc(c.filename)}"><span class="clip-selection-text">Select</span></label><a class="clip-download" href="${base}/clips/${c.id}/file?${auth}&download=1" aria-label="Download ${esc(c.filename)}"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m-4-4 4 4 4-4M4 13v4h12v-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Download</span></a></div>`:""}</article>`).join('')||'No clips uploaded yet.';document.getElementById('clip-filter').oninput=renderFilter;renderFilter();window.OffsetUploadTime?.update();
 document.querySelectorAll('.offset-frame-select').forEach(select=>{
   const stage=select.closest('.clip').querySelector('.offset-video-stage');
   const guides=stage.querySelector('.offset-frame-guides');
   const video=stage.querySelector('video');
   const update=()=>{
     const value=select.value;
     if(value==='off'){guides.hidden=true;return}
     const ratio=Number(value);
     const vw=video.videoWidth||16,vh=video.videoHeight||9;
     // Match the *visible* video image, not any letterboxed HTML box.
     const box=stage.getBoundingClientRect();
     const native=vw/vh;
     const visibleWidth=Math.min(box.width,box.height*native);
     const visibleHeight=visibleWidth/native;
     let w=visibleWidth,h=visibleHeight;
     if(ratio>native) h=visibleWidth/ratio;
     else w=visibleHeight*ratio;
     guides.style.width=(100*w/box.width)+'%';
     guides.style.height=(100*h/box.height)+'%';
     guides.hidden=false;
   };
   select.addEventListener('change',update);
   video.addEventListener('loadedmetadata',update);
   window.addEventListener('resize',update);
 });
 document.querySelectorAll('.clip video').forEach(video=>{
   const card=video.closest('.clip');
   const help=card.querySelector('.playback-help');
   video.addEventListener('error',()=>{help.hidden=false});
   video.addEventListener('stalled',()=>{help.hidden=false});
   video.addEventListener('playing',()=>{help.hidden=true});
 });
 let toolbar=document.getElementById('offset-tools');if(!toolbar){toolbar=document.createElement('div');toolbar.id='offset-tools';$('clips').before(toolbar)}
 toolbar.innerHTML=(allowDownloads?'<div class="selection-tools"><button id="select-all" type="button" class="secondary">Select all</button><span id="selected-count" role="status" aria-live="polite"></span><button id="download-selected" type="button" disabled>Download ZIP <span aria-hidden="true">↓</span></button></div>':'<span class="muted">Downloads disabled for this project</span>');
 const update=()=>{
  const count=$('selected-count');if(!count)return;
  const bytes=clips.reduce((total,clip)=>total+(selected.has(clip.id)?Math.max(0,Number(clip.size)||0):0),0);
  count.textContent=selected.size?`${selected.size} selected · ${formatStorageBytes(bytes)}`:'No clips selected';
  count.title='Combined size of selected clips';
  $('download-selected').disabled=selected.size===0;
  $('select-all').disabled=clips.length===0;
  $('select-all').textContent=clips.length&&clips.every(clip=>selected.has(clip.id))?'Clear selection':'Select all';
  document.querySelectorAll('[data-select]').forEach(input=>{
   const card=input.closest('.clip');card?.classList.toggle('offset-clip-selected',input.checked);
   const label=card?.querySelector('.clip-selection-text');if(label)label.textContent=input.checked?'Selected':'Select';
  });
 };
 document.querySelectorAll('[data-select]').forEach(el=>{el.checked=selected.has(el.dataset.select);el.onchange=()=>{el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select);update()}});
 if(allowDownloads) $('select-all').onclick=()=>{let all=clips.every(c=>selected.has(c.id));selected=all?new Set():new Set(clips.map(c=>c.id));document.querySelectorAll('[data-select]').forEach(el=>el.checked=selected.has(el.dataset.select));update()};
 if(allowDownloads) $('download-selected').onclick=()=>{if(!selected.size)return alert('Select at least one clip');location.href=`${base}/download-selected?${auth}&ids=${[...selected].join(',')}`};update();
 if(typeof window.initOffsetPlayer==='function') window.initOffsetPlayer(clips,base,auth,allowDownloads);
 clips.forEach(async c=>{try{let r=await fetch(`${base}/clips/${c.id}/duration?${auth}`);let d=await r.json();if(d.seconds!=null){let n=Math.floor(d.seconds);let el=document.getElementById(`dur-${c.id}`);if(el)el.textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}}catch(e){}});
 try{const r=await fetch(`${base}/storage?${auth}`,{cache:'no-store'});if(!r.ok)throw Error('Storage information unavailable');renderStorage(await r.json())}catch(e){$('storage-status').textContent='Storage information unavailable. Please refresh.'}
}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script><script src="/static/review-enhancements.js?v=4"></script><script src="/static/offset-player.js?v=frame-panel-1"></script><script src="/static/incoming-status.js?v=5"></script><script defer src="/static/offset-pwa.js?v=1"></script></body></html>
