<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIELDLINK · Review</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><header class="top"><a class="brand" href="/">FIELD<span>LINK</span></a><div class="tag">PRIVATE REVIEW</div></header><section class="hero"><p class="eyebrow">SECURE DAILIES</p><h1>Review from<br><em>wherever you are.</em></h1><p class="muted">Privat tilgang til opptak fra felt.</p></section><section class="panel" id="gate"><p class="eyebrow">ACCESS REQUIRED</p><h2>Prosjekt-PIN</h2><label>PIN-kode<input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="6-sifret PIN"></label><button id="unlock">Åpne rushes</button><p id="error" class="error"></p></section><section id="content" class="hidden"><div class="panel"><p class="eyebrow">PROJECT MEDIA</p><h2>Rushes</h2><p class="muted" id="count"></p><div id="clips" class="clipgrid"></div></div></section><footer>FIELDLINK <span>·</span> PRIVATE RUSHES DELIVERY</footer></main><script>
const slug=location.pathname.split('/').filter(Boolean).pop();let token='';const $=id=>document.getElementById(id);$('unlock').onclick=unlock;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});async function unlock(){try{let r=await fetch(`/api/review/${slug}/unlock`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Feil PIN');token=d.token;$('gate').classList.add('hidden');$('content').classList.remove('hidden');await load()}catch(e){$('error').textContent=e.message}}
async function load(){let r=await fetch(`/api/review/${slug}/clips`,{headers:{Authorization:`Bearer ${token}`}});let a=await r.json();if(!r.ok)throw Error(a.detail||'Kunne ikke hente klipp');$('count').textContent=`${a.length} klipp tilgjengelig`;$('clips').innerHTML=a.length?a.map(c=>`<article class="clip"><video controls preload="metadata" playsinline src="/api/review/${slug}/clips/${c.id}/file" data-auth="${token}"></video><div class="clipmeta"><b>${esc(c.filename)}</b><span>${(c.size/1048576).toFixed(1)} MB</span></div><a href="#" data-download="${c.id}">Last ned klipp ↓</a></article>`).join(''):'Ingen klipp er lastet opp ennå.';document.querySelectorAll('video').forEach(v=>{v.src=`/api/review/${slug}/clips/${v.parentElement.querySelector('[data-download]').dataset.download}/file?session=${encodeURIComponent(token)}`});document.querySelectorAll('[data-download]').forEach(a=>a.onclick=async e=>{e.preventDefault();let id=a.dataset.download;let f=await fetch(`/api/review/${slug}/clips/${id}/file?session=${encodeURIComponent(token)}`);let b=await f.blob();let u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download=a.parentElement.querySelector('b').textContent;x.click();URL.revokeObjectURL(u)})}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
