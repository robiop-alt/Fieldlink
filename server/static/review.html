<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="OFFSET"><link rel="apple-touch-icon" sizes="180x180" href="/pwa/icon-180.png"><link id="offset-pwa-manifest" rel="manifest" href="/app.webmanifest"><script>document.getElementById('offset-pwa-manifest').href='/app.webmanifest?project='+encodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');</script><title>OFFSET · Review</title><link rel="stylesheet" href="/static/style.css?v=logo-fix-2"><link rel="stylesheet" href="/static/review-enhancements.css?v=1"><link rel="stylesheet" href="/static/offset-player.css?v=10"><link rel="stylesheet" href="/static/incoming-status.css?v=2"><style>
.offset-video-stage{position:relative;background:#080b0c;overflow:hidden;border-radius:9px}
.offset-video-stage video{display:block;width:100%;height:auto;min-height:160px;background:#000}
.offset-frame-guides{pointer-events:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.75)}
.offset-frame-guides[hidden]{display:none}
.offset-view-controls{display:flex;justify-content:flex-end;gap:10px;margin:8px 0 12px}
.offset-view-controls label{font-size:12px;color:#b6c1c3;display:flex;align-items:center;gap:6px}
.offset-view-controls select{background:#20272a;color:#fff;border:1px solid #556064;border-radius:6px;padding:5px 8px}
</style></head><body><main class="shell"><header class="top"><a class="brand" href="/"><img src="/static/offset-logo.svg?v=approved-artwork-1" alt="OFFSET." width="140" height="34" style="display:block;width:140px;max-width:38vw;height:auto;min-height:32px" /></a><div class="tag">PRIVATE REVIEW</div></header><section class="review-intro"><p class="eyebrow">PRODUCTION / REVIEW</p><h1>Rushes</h1><p class="muted">Proxy files · Secure review</p></section><section class="panel" id="gate"><p class="eyebrow">ACCESS REQUIRED</p><h2>Project PIN</h2><label>PIN code<input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit PIN"></label><button id="unlock">Open rushes</button><p id="error" class="error"></p></section><section id="content" class="hidden"><div class="panel review-panel"><div class="review-heading"><h2>Project media</h2><p class="muted" id="count"></p></div><div id="review-toolbar"><div id="metadata-filters"></div><div id="offset-tools"></div></div><section id="offset-incoming" aria-label="Incoming rushes" hidden></section><div id="review-player-host"></div><div id="clips" class="clipgrid"></div><details class="review-storage"><summary>Storage information</summary><p id="storage-status" class="muted"></p></details></div></section><footer>OFFSET <span>·</span> PRIVATE RUSHES DELIVERY</footer></main><script>
fetch('/api/site/settings').then(r=>{if(!r.ok)throw Error('Settings unavailable');return r.json()}).then(data=>{for(const key of ['review_title','review_highlight','review_description']){const el=document.getElementById(key);if(el&&typeof data[key]==='string')el.textContent=data[key]}}).catch(()=>{});
const slug=encodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');let token='';const storageKey=`offset-review-session:${slug}`;const $=id=>document.getElementById(id);function saveAccess(data){token=data.token;try{sessionStorage.setItem(storageKey,JSON.stringify({token:data.token,expires:data.expires}))}catch(e){}}function clearAccess(){token='';try{sessionStorage.removeItem(storageKey)}catch(e){}}function showGate(message=''){clearAccess();$('gate').classList.remove('hidden');$('content').classList.add('hidden');$('error').textContent=message}async function openAccess(data){saveAccess(data);$('gate').classList.add('hidden');$('content').classList.remove('hidden');try{await load()}catch(e){showGate(e.message||'Please enter your PIN again.')}}$('unlock').onclick=unlock;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});async function unlock(){try{let r=await fetch(`/api/review/${slug}/unlock`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'Invalid PIN');await openAccess(d)}catch(e){$('error').textContent=e.message}}
// Reuse a valid review session on refresh, without storing the project PIN.
(async()=>{if(new URLSearchParams(location.hash.slice(1)).has('share'))return;try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(!saved||!saved.token||!Number.isFinite(saved.expires)||saved.expires<=Date.now()/1000){clearAccess();return}await openAccess(saved)}catch(e){showGate()}})();
// Public projects issue short-lived sessions automatically; the project link itself does not expire.
(async()=>{if(new URLSearchParams(location.hash.slice(1)).has('share'))return;try{const r=await fetch(`/api/review/${slug}/public-unlock`,{method:'POST'});if(!r.ok)return;await openAccess(await r.json())}catch(e){$('error').textContent='Unable to open project. Please refresh.'}})();
let selected=new Set();
// PIN-free share links carry a 24-hour signed token in the URL fragment.
(async()=>{
 const share=new URLSearchParams(location.hash.slice(1)).get('share');
 if(!share)return;
 history.replaceState(null,'',location.pathname+location.search);
 try{
  const r=await fetch(`/api/review/${slug}/share-unlock`,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({share_token:share})
  });
  const data=await r.json();
  if(!r.ok)throw Error(data.detail||'Share link has expired');
  await openAccess(data);
 }catch(e){$('error').textContent=e.message+' · Enter the project PIN to continue.'}
})();

async function load(){
 const r=await fetch(`/api/review/${slug}/clips`,{headers:{Authorization:`Bearer ${token}`}});
 const clips=await r.json();if(!r.ok)throw Error(clips.detail||'Could not load clips');
 selected=new Set();
 $('count').textContent=`${clips.length} clips available`;
 let filters=document.getElementById('metadata-filters');
 if(!filters){filters=document.createElement('div');filters.id='metadata-filters';$('clips').before(filters)}
 filters.innerHTML='<label class="filter-compact"><span>Filter clips</span><input id="clip-filter" type="search" placeholder="Camera, codec, focal length…" aria-label="Filter clips"></label>';
 const renderFilter=()=>{const q=document.getElementById('clip-filter').value.toLowerCase();
 document.querySelectorAll('.clip[data-search]').forEach(el=>{el.style.display=el.dataset.search.includes(q)?'':'none'})};
 const base=`/api/review/${slug}`;const auth=`session=${encodeURIComponent(token)}`;
 const formatDuration=s=>{let n=Math.max(0,Math.floor(Number(s)));return Number.isFinite(n)?`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`:'--:--'};
 $('clips').innerHTML=clips.map(c=>`<article class="clip" data-search="${esc([c.filename,...Object.values(c.metadata||{})].join(' ').toLowerCase())}"><div class="offset-video-stage"><video controls preload="none" playsinline webkit-playsinline poster="${base}/clips/${c.id}/thumbnail?${auth}" src="${base}/clips/${c.id}/file?${auth}"></video><div class="offset-frame-guides" aria-hidden="true" hidden></div></div><div class="offset-view-controls"><label>Frame lines <select class="offset-frame-select" aria-label="Frame lines for ${esc(c.filename)}"><option value="off">Off</option><option value="2.39">2.39:1</option><option value="2.00">2.00:1</option><option value="2.20">2.20:1</option><option value="1.85">1.85:1</option><option value="1.78">16:9</option><option value="1.33">4:3</option><option value="1.00">1:1</option><option value="0.80">4:5</option><option value="0.5625">9:16</option></select></label></div><p class="playback-help" id="playback-${c.id}" hidden>Browser playback unavailable. <a href="${base}/clips/${c.id}/file?${auth}" target="_blank" rel="noopener">Open video directly</a> or use Download clip below.</p><div class="clipmeta"><b>${esc(c.filename)}</b><span><span id="dur-${c.id}">${c.metadata?.duration_seconds!=null?formatDuration(c.metadata.duration_seconds):"--:--"}</span> · <span class="muted">${(c.size/1048576).toFixed(1)} MB</span></span><small>${esc(Object.entries(c.metadata||{}).filter(([k,v])=>v!==null&&v!==undefined&&v!=='').map(([k,v])=>`${k.replaceAll('_',' ')}: ${v}`).join(' · ')||'No readable camera metadata')}</small></div><label><input type="checkbox" data-select="${c.id}"> Select clip</label><a href="${base}/clips/${c.id}/file?${auth}&download=1">Download clip ↓</a></article>`).join('')||'No clips uploaded yet.';document.getElementById('clip-filter').oninput=renderFilter;
 document.querySelectorAll('.offset-frame-select').forEach(select=>{
   const stage=select.closest('.clip').querySelector('.offset-video-stage');
   const guides=stage.querySelector('.offset-frame-guides');
   const video=stage.querySelector('video');
   const update=()=>{
     const value=select.value;
     if(value==='off'){guides.hidden=true;return}
     const ratio=Number(value);
     const vw=video.videoWidth||16,vh=video.videoHeight||9;
     // Match the *visible* video image, not any letterboxed HTML box.
     const box=stage.getBoundingClientRect();
     const native=vw/vh;
     const visibleWidth=Math.min(box.width,box.height*native);
     const visibleHeight=visibleWidth/native;
     let w=visibleWidth,h=visibleHeight;
     if(ratio>native) h=visibleWidth/ratio;
     else w=visibleHeight*ratio;
     guides.style.width=(100*w/box.width)+'%';
     guides.style.height=(100*h/box.height)+'%';
     guides.hidden=false;
   };
   select.addEventListener('change',update);
   video.addEventListener('loadedmetadata',update);
   window.addEventListener('resize',update);
 });
 document.querySelectorAll('.clip video').forEach(video=>{
   const card=video.closest('.clip');
   const help=card.querySelector('.playback-help');
   video.addEventListener('error',()=>{help.hidden=false});
   video.addEventListener('stalled',()=>{help.hidden=false});
   video.addEventListener('playing',()=>{help.hidden=true});
 });
 let toolbar=document.getElementById('offset-tools');if(!toolbar){toolbar=document.createElement('div');toolbar.id='offset-tools';$('clips').before(toolbar)}
 toolbar.innerHTML='<button id="select-all" type="button">Select all</button> <button id="download-selected" type="button">Download selected (ZIP)</button> <span id="selected-count"></span> <p id="storage-status" class="muted"></p><p class="muted">Originals are stored in durable cloud storage; local cache is managed automatically.</p>';
 const update=()=>{$('selected-count').textContent=`${selected.size} selected`};
 document.querySelectorAll('[data-select]').forEach(el=>{el.checked=selected.has(el.dataset.select);el.onchange=()=>{el.checked?selected.add(el.dataset.select):selected.delete(el.dataset.select);update()}});
 $('select-all').onclick=()=>{let all=clips.every(c=>selected.has(c.id));selected=all?new Set():new Set(clips.map(c=>c.id));document.querySelectorAll('[data-select]').forEach(el=>el.checked=selected.has(el.dataset.select));update()};
 $('download-selected').onclick=()=>{if(!selected.size)return alert('Select at least one clip');location.href=`${base}/download-selected?${auth}&ids=${[...selected].join(',')}`};update();
 if(typeof window.initOffsetPlayer==='function') window.initOffsetPlayer(clips,base,auth);
 clips.forEach(async c=>{try{let r=await fetch(`${base}/clips/${c.id}/duration?${auth}`);let d=await r.json();if(d.seconds!=null){let n=Math.floor(d.seconds);let el=document.getElementById(`dur-${c.id}`);if(el)el.textContent=`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`}}catch(e){}});
 try{let r=await fetch(`${base}/storage?${auth}`);let d=await r.json();$('storage-status').textContent=`Local cache: ${(d.used_bytes/1073741824).toFixed(2)} / ${(d.limit_bytes/1073741824).toFixed(0)} GB`;}catch(e){}
}

function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script><script src="/static/review-enhancements.js?v=1"></script><script src="/static/offset-player.js?v=8"></script><script src="/static/incoming-status.js?v=2"></script><script defer src="/static/offset-pwa.js?v=1"></script></body></html>
