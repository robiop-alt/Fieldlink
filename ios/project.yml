name: OFFSET
options:
  bundleIdPrefix: no.offset
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  OFFSET:
    type: application
    platform: iOS
    sources:
      - path: OFFSET
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.offset.rushes
        INFOPLIST_KEY_CFBundleDisplayName: OFFSET
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    info:
      path: OFFSET/Info.plist
      properties:
        CFBundleURLTypes: []
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
